# Pipeline de CI/CD da infraestrutura (infra/ - Terraform).
# PR: valida e mostra plano (nunca aplica automaticamente).
# Apply: so via workflow_dispatch manual, ambiente com aprovacao obrigatoria
# (protecao de environment configurada no repositorio, ver .md/DEPLOY.md).

name: Infra CI/CD (Terraform)

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo (staging|production)"
        required: true
        type: choice
        options: [staging, production]
      action:
        description: "Acao Terraform"
        required: true
        type: choice
        options: [plan, apply]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false
      - run: terraform validate
      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint
      - name: Checkov (scan de seguranca de IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          soft_fail: false # estagio falha o pipeline, nao segue "mesmo assim"

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configura credencial AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: sa-east-1
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan.binary
        continue-on-error: true
        id: plan
      # Plano publicado como comentario no PR para revisao humana antes do
      # apply manual - nunca aplicado neste job.

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # aprovacao manual obrigatoria em producao (protecao de environment)
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configura credencial AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: sa-east-1
      - run: terraform init
      - run: terraform apply -auto-approve
